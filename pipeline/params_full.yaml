# Parametros de nf-core/rnaseq para la corrida completa (kras-rnaseq)
# Referencia: GENCODE release 50, humano GRCh38
# Origen: https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_50/
# Copia propia en S3 para no depender de la disponibilidad de EBI

fasta: "s3://kras-rnaseq-201507414770/reference/gencode_v50/GRCh38.primary_assembly.genome.fa.gz"
gtf:   "s3://kras-rnaseq-201507414770/reference/gencode_v50/gencode.v50.basic.annotation.gtf.gz"
gencode: true

# Solo Salmon (sin STAR)
pseudo_aligner: salmon
skip_alignment: true

# Reutilizar el indice construido en el piloto
salmon_index: "s3://kras-rnaseq-201507414770/results-pilot/genome/index/salmon"
save_reference: false
